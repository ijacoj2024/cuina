<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Llista temporal · Cuina</title><style>body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px}.card{max-width:520px;margin:auto;background:white;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0001}h1{font-size:22px}li{padding:8px 0;font-size:18px}button,a{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:12px;padding:14px;border-radius:14px;border:0;font-weight:800;text-decoration:none}.primary{background:#ea580c;color:white}.secondary{background:#e2e8f0;color:#334155}.muted{color:#64748b;font-size:13px}</style></head><body><main class="card"><h1 id="title">Carregant llista…</h1><p id="recipe"></p><ul id="items"></ul><p class="muted" id="expiry"></p><button class="primary" id="copy" hidden>Copiar aliments</button><a class="secondary" id="bring" href="https://web.getbring.com" target="_blank" rel="noopener">Obrir Bring!</a><p class="muted">Aquest enllaç només mostra els aliments que has seleccionat. Caduca en menys de 24 hores.</p></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>firebase.initializeApp({databaseURL:'https://calendari-menjars-default-rtdb.europe-west1.firebasedatabase.app'});const token=new URLSearchParams(location.search).get('token');const title=document.getElementById('title'),itemsEl=document.getElementById('items'),copy=document.getElementById('copy');if(!token||!/^[A-Za-z0-9_-]{10,80}$/.test(token)){title.textContent='Enllaç no vàlid';}else{firebase.database().ref('bring_exports/'+token).once('value').then(s=>{const d=s.val();if(!d||!Array.isArray(d.items)||Date.now()>Number(d.expiresAt||0)){title.textContent='Aquest enllaç ha caducat';return;}title.textContent=d.action==='remove'?'Productes a revisar a Bring!':'Productes per afegir a Bring!';document.getElementById('recipe').textContent=d.recipe||'';d.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;itemsEl.appendChild(li)});document.getElementById('expiry').textContent='Caduca: '+new Date(d.expiresAt).toLocaleString('ca-ES');copy.hidden=false;copy.onclick=async()=>{try{await navigator.clipboard.writeText(d.items.join('\n'));copy.textContent='✓ Copiat';}catch(e){copy.textContent='No s’ha pogut copiar';}}}).catch(()=>title.textContent='No s’ha pogut carregar la llista');}</script></body></html>
