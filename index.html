<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuina de Casa Pro</title>
</head>
<body>
<script>
(async () => {
  try {
    const response = await fetch('app.html', {cache:'no-store'});
    let html = await response.text();
    html = html.replace('</body>', '<script src="bring-integration.js?v=20260910"></' + 'script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">No s\'ha pogut carregar el calendari. Recarrega la pàgina.</p>';
  }
})();
</script>
</body>
</html>
