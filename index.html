<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuina de Casa Pro</title>
</head>
<body>
<script>
(async () => {
  try {
    const response = await fetch('app.html', {cache:'no-store'});
    let html = await response.text();
    const scripts = [
      'recipe-ingredients-1.js?v=20260912b',
      'recipe-ingredients-2.js?v=20260912b',
      'recipe-ingredients-3.js?v=20260912b',
      'recipe-ingredients-4.js?v=20260912b',
      'recipe-ingredients-5.js?v=20260912b',
      'recipe-ingredients-6.js?v=20260912b',
      'recipe-ingredients-loader.js?v=20260912b',
      'bring-integration.js?v=20260912b'
    ].map(src => '<script src="' + src + '"></' + 'script>').join('');
    html = html.replace('</body>', scripts + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">No s\'ha pogut carregar el calendari. Recarrega la pàgina.</p>';
  }
})();
</script>
</body>
</html>
