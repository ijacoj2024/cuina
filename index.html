<!DOCTYPE html>
<html lang="ca">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #f59e0b;
            --dark-card: #1e293b;
            --dark-today: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            padding-bottom: 120px;
        }

        .day-card-dark {
            background-color: var(--dark-card);
            color: white;
            border-radius: 2rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .today-card {
            border: 6px solid var(--primary) !important;
            background-color: var(--dark-today) !important;
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.4);
            transform: scale(1.02);
            z-index: 10;
        }

        .btn-add-dashed {
            width: 100%;
            border: 1px dashed rgba(255,255,255,0.3);
            border-radius: 1rem;
            padding: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .item-row {
            background: rgba(255,255,255,0.08);
            border-radius: 0.75rem;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 6px;
            border-left: 3px solid var(--primary);
        }

        .section-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            gap: 4px;
        }

        .active-tab {
            background-color: var(--primary) !important;
            color: white !important;
            transform: translateY(-4px);
        }

        .caducitat-alert {
            background-color: #fee2e2;
            color: #b91c1c;
            border-radius: 1rem;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 8px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .caducitat-delete {
            background: rgba(185, 28, 28, 0.1);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 10px;
            margin-left: 8px;
        }

        .recipe-card-text {
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            display: block;
            width: 100%;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #334155;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .food-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: transform 0.2s;
        }

        .food-card:active {
            transform: scale(0.98);
        }

        .action-btn-circle {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 18px;
            background: #f1f5f9;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .action-btn-circle.active-heart { background: #fee2e2; }

        .link-footer-btn {

            border-radius: 12px;

            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;

            border: 1px solid #f1f5f9;

        }

    </style>
</head>

        function localISODate(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTemporadaLabel(month) {
            if ([12, 1, 2].includes(month)) return "Hivern";
            if ([3, 4, 5].includes(month)) return "Primavera";
            if ([6, 7, 8].includes(month)) return "Estiu";
            return "Tardor";
        }

        function dateSeed(isoDate) {
            let hash = 0;
            for (let i = 0; i < isoDate.length; i++) {
                hash = ((hash << 5) - hash) + isoDate.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function filterSuggerimentsPool(month, relax = false) {
            const { persones, minutsMax, economia } = SUGGERIMENT_CRITERIS;
            let pool = suggerimentsCatalog.filter(r =>
                r.mesos.includes(month) &&
                r.persones === persones &&
                r.minuts <= minutsMax &&
                (!economia || r.economia)
            );

            if (pool.length === 0 || relax) {
                pool = suggerimentsCatalog.filter(r =>
                    r.mesos.includes(month) &&
                    r.persones === persones &&
                    r.minuts <= minutsMax + 5
                );
            }

            if (pool.length === 0) {
                const adjacent = [month, month === 1 ? 12 : month - 1, month === 12 ? 1 : month + 1];
                pool = suggerimentsCatalog.filter(r =>
                    r.mesos.some(m => adjacent.includes(m)) &&
                    r.persones === persones &&
                    r.minuts <= minutsMax + 5
                );
            }

            return pool.sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
        }

        function getDailySuggestion(date = new Date()) {
            const month = date.getMonth() + 1;
            const iso = localISODate(date);
            let pool = filterSuggerimentsPool(month);

            if (pool.length === 0) {
                pool = suggerimentsCatalog
                    .filter(r => r.persones === SUGGERIMENT_CRITERIS.persones && r.minuts <= SUGGERIMENT_CRITERIS.minutsMax + 5)
                    .sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
            }

            const index = dateSeed(iso) % pool.length;
            const recipe = pool[index];
            return {
                ...recipe,
                temps: `~${recipe.minuts} min`,
                temporada: getTemporadaLabel(month)
            };
        }

        window.onload = initFirebase;

        function initFirebase() {
            const config = { databaseURL: "https://calendari-menjars-default-rtdb.europe-west1.firebasedatabase.app" };
            if (!firebase.apps.length) firebase.initializeApp(config);
            db = firebase.database();
            
            db.ref('aliments').on('value', s => {
                const val = s.val() || {};
                allAliments = Object.keys(val).map(key => ({ ...val[key], id: key }));
                render();
            });
            db.ref('seleccions').on('value', s => { allSelections = s.val() || {}; render(); });
            
            db.ref('aliments_caducitat').on('value', s => { 
                allCaducitats = s.val() || {}; 
                cleanExpiredCaducitats();
                render(); 
            });
        }

        function cleanExpiredCaducitats() {
            const todayStr = new Date().toISOString().split('T')[0];
            Object.entries(allCaducitats).forEach(([id, item]) => {
                if (item.caducitat < todayStr) {
                    db.ref('aliments_caducitat').child(id).remove();
                }
            });
        }

        function setTab(tab) {
            activeTab = (activeTab === tab) ? 'none' : tab;
            render();
        }

        function changeWeek(dir) {
            offset += dir;
            // ← NOU: si tornem a la setmana actual, permet fer scroll de nou al dia d'avui
            if (offset === 0) hasScrolledToToday = false;
            render();
        }

        function render() {
            renderHeader();
            renderCalendar();
            renderDynamic();
            renderDailySuggestion();
            updateUI();
        }

        function renderHeader() {
            const d = new Date();
            const start = new Date(d.setDate(d.getDate() - (d.getDay() || 7) + 1 + (offset * 7)));
            const end = new Date(start); end.setDate(start.getDate() + 6);
            const r = document.getElementById('rango-fechas');
            if(r) r.innerText = `${start.getDate()}/${start.getMonth()+1} - ${end.getDate()}/${end.getMonth()+1}`;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if(!grid) return;
            if(activeTab !== 'none') {
                grid.innerHTML = "";
                return;
            }
            grid.innerHTML = "";
            const today = new Date().toISOString().split('T')[0];
            const d = new Date();
            const start = new Date(d.setDate(d.getDate() - (d.getDay() || 7) + 1 + (offset * 7)));
            const dies = ["DILLUNS", "DIMARTS", "DIMECRES", "DIJOUS", "DIVENDRES", "DISSABTE", "DIUMENGE"];
            
            for(let i=0; i<7; i++) {
                const cur = new Date(start); cur.setDate(start.getDate() + i);
                const iso = cur.toISOString().split('T')[0];
                const alertsEntries = Object.entries(allCaducitats).filter(([id, c]) => c && c.caducitat === iso);
                
                const card = document.createElement('div');
                card.className = `day-card-dark ${iso === today ? 'today-card' : ''}`;
                card.innerHTML = `
                    <div class="mb-4">
                        <span class="text-[10px] font-bold text-orange-400">${dies[i]}</span>
                        <h2 class="text-4xl font-black">${cur.getDate()}</h2>
                        <div class="mt-2 space-y-1">
                            ${alertsEntries.map(([id, a]) => `
                                <div class="caducitat-alert">
                                    <span class="truncate pr-1">⚠️ ${a.nom}</span>
                                    <button onclick="deleteCaducitat('${id}', true)" class="caducitat-delete">×</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="w-full text-left space-y-6">
                        <div>
                            <div class="section-label">☀️ DINAR</div>
                            <div id="list-${iso}-comida">${renderPlats(iso, 'comida')}</div>
                            <button onclick="openSelector('${iso}', 'comida')" class="btn-add-dashed">+ AFEGIR PLAT</button>
                        </div>
                        <div>
                            <div class="section-label">🌙 SOPAR</div>
                            <div id="list-${iso}-cena">${renderPlats(iso, 'cena')}</div>
                            <button onclick="openSelector('${iso}', 'cena')" class="btn-add-dashed">+ AFEGIR PLAT</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }

            // ← NOU: scroll automàtic al dia d'avui només la primera vegada
            if (!hasScrolledToToday) {
                const todayCard = grid.querySelector('.today-card');
                if (todayCard) {
                    setTimeout(() => {
                        todayCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        hasScrolledToToday = true;
                    }, 150);
                }
            }
        }

        function renderPlats(fecha, tipo) {
            const p = (allSelections[fecha] && Array.isArray(allSelections[fecha][tipo])) ? allSelections[fecha][tipo] : [];
            return p.map((n, i) => `
                <div class="item-row">
                    <span class="text-sm font-bold recipe-card-text">${n}</span>
                    <button onclick="removePlat('${fecha}','${tipo}',${i})" class="text-white/20 hover:text-red-400 ml-2 shrink-0">×</button>
                </div>
            `).join('');
        }

        function renderDynamic() {
            const cont = document.getElementById('dynamic-content');
            const list = document.getElementById('list-tab-content');
            const cad = document.getElementById('caducitat-tab-content');
            const exp = document.getElementById('export-tab-content');
            
            if(cont) cont.classList.toggle('hidden', activeTab === 'none');
            if(list) list.classList.toggle('hidden', !['all', 'favs', 'provar'].includes(activeTab));
            if(cad) cad.classList.toggle('hidden', activeTab !== 'caducitat');
            if(exp) exp.classList.toggle('hidden', activeTab !== 'export');
            
            if(activeTab === 'caducitat') renderCadList();
            if(['all', 'favs', 'provar'].includes(activeTab)) renderFoodGrid();
        }

        function renderFoodGrid() {
            const grid = document.getElementById('main-grid');
            const searchInput = document.getElementById('search-input');
            if(!grid) return;
            const search = searchInput ? searchInput.value.toLowerCase() : "";
            grid.innerHTML = "";
            let filtered = allAliments.filter(a => (a && a.nom ? a.nom.toLowerCase() : "").includes(search));
            
            if(activeTab === 'favs') filtered = filtered.filter(a => a && a.fav);
            if(activeTab === 'provar') filtered = filtered.filter(a => a && a.provar);
            
            filtered.sort((a,b) => (a.nom || "").localeCompare(b.nom || "")).forEach(a => {
                const div = document.createElement('div');
                div.className = "food-card cursor-pointer";
                const isFav = !!a.fav;
                const isProvar = !!a.provar;
                const safeNom = (a.nom || '').replace(/'/g, "\\'");
                const safeLink = (a.link || '').replace(/'/g, "\\'");
                
                div.innerHTML = `
                    <div class="flex items-center justify-between gap-4">
                        <div class="action-btn-circle ${isFav ? 'active-heart' : ''}" onclick="toggleFav('${a.id}', ${!isFav}, event)">
                            ${isFav ? '❤️' : '🤍'}
                        </div>
                        <div class="text-center flex-1" onclick="openEditById('${a.id}')">
                            <div class="text-sm font-black leading-tight recipe-card-text">${a.nom || 'Sense nom'}</div>
                        </div>
                        <div class="action-btn-circle ${isProvar ? 'active-eyes' : ''}" onclick="toggleProvar('${a.id}', ${!isProvar}, event)">
                            ${isProvar ? '👀' : '👁️'}
                        </div>
                    </div>
                    <div class="link-footer-btn" onclick="handleActionClick(event, '${safeLink}', '${safeNom}')">
                        <span>${a.link ? '🔗 VEURE WEB' : '🔍 BUSCAR'}</span>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function renderCadList() {
            const grid = document.getElementById('cad-list-grid');
            if(!grid) return;
            grid.innerHTML = "";
            const entries = Object.entries(allCaducitats).sort((a,b) => new Date(a[1].caducitat) - new Date(b[1].caducitat));
            entries.forEach(([id, c]) => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex-1 pr-4">
                        <div class="font-black text-sm recipe-card-text">${c.nom}</div>
                        <div class="text-[10px] font-bold text-red-500 uppercase">${c.caducitat}</div>
                    </div>
                    <button onclick="deleteCaducitat('${id}')" class="text-red-400 font-black text-xs px-3">ESBORRAR</button>
                `;
                grid.appendChild(div);
            });
        }

        function renderDailySuggestion() {
            const container = document.getElementById('daily-suggestion-container');
            if (!container) return;
            if (activeTab !== 'none') {
                container.innerHTML = "";
                return;
            }

            const recipe = getDailySuggestion(new Date());
            const safeNom = recipe.nom.replace(/'/g, "\\'");
            const safeIng = recipe.ingredients.replace(/'/g, "\\'").replace(/\n/g, " ");
            const safeMet = recipe.metode.replace(/'/g, "\\'").replace(/\n/g, " ");
            const safeLnk = (recipe.link || '').replace(/'/g, "\\'");
            const linkLabel = recipe.link ? 'VEURE WEB' : 'BUSCAR RECEPTA';

            container.innerHTML = `
                <div class="seasonal-suggestion">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-orange-600 bg-orange-200 px-2 py-1 rounded-lg">SUGGERIMENT DEL DIA 🌿</span>
                        <span class="text-[10px] font-bold text-slate-500">${recipe.temporada}</span>
                    </div>
                    <h3 class="text-lg font-black leading-tight mb-2">${recipe.nom}</h3>
                    <div class="suggestion-badges">
                        <span class="suggestion-badge">👥 ${recipe.persones} persones</span>
                        <span class="suggestion-badge">⏱️ ${recipe.temps}</span>
                        <span class="suggestion-badge">💰 Econòmic</span>
                        <span class="suggestion-badge">🥬 De temporada</span>
                    </div>
                    <p class="text-[11px] font-medium text-slate-600 leading-relaxed mb-3">${recipe.ingredients}</p>
                    <div class="flex gap-2">
                        <button onclick="handleActionClick(event, '${safeLnk}', '${safeNom}')" class="flex-1 bg-white border border-amber-300 text-amber-700 py-3 rounded-xl text-center text-[11px] font-black">${linkLabel}</button>
                        <button onclick="autoSaveSuggestion('${safeNom}', '${safeIng}', '${safeMet}', '${safeLnk}')" class="flex-1 bg-orange-500 text-white py-3 rounded-xl text-[11px] font-black shadow-md">DESAR ＋</button>
                    </div>
                </div>
            `;
        }

        function updateUI() {
            ['all', 'favs', 'provar', 'caducitat', 'export'].forEach(t => {
                const btn = document.getElementById('btn-' + t);
                if(btn) btn.classList.toggle('active-tab', activeTab === t);
            });
        }

        window.saveCaducitat = () => {
            const nom = document.getElementById('cad-nom').value;
            const data = document.getElementById('cad-data').value;
            if(!nom || !data) return;
            db.ref('aliments_caducitat').push({ nom, caducitat: data }).then(() => {
                document.getElementById('cad-nom').value = "";
                document.getElementById('cad-data').value = "";
                showToast("Afegit correctament");
            });
        };

        window.deleteCaducitat = (id, silent = false) => {
            if (silent || confirm("Eliminar caducitat?")) {
                db.ref('aliments_caducitat').child(id).remove().then(() => {
                    if(silent) showToast("Caducitat eliminada");
                });
            }
        };

        window.toggleFav = (id, val, e) => {
            if(e) e.stopPropagation();
            db.ref('aliments').child(id).update({ fav: val });
        };

        window.toggleProvar = (id, val, e) => {
            if(e) e.stopPropagation();
            db.ref('aliments').child(id).update({ provar: val });
        };

        window.autoSaveSuggestion = (nom, ing, met, lnk) => {
            const data = {
                nom, ingredients: ing || '', metode: met || '', link: lnk || '', fav: false, provar: true
            };
            db.ref('aliments').push(data).then(() => { showToast("Recepta guardada!"); });
        };

        window.openCreateAliment = (nom, ing, met, lnk) => {
            showModal(`
                <div class="p-8 space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-black">Nova Recepta</h2>
                        <button onclick="closeModal()" class="text-slate-400 text-2xl">×</button>
                    </div>
                    <div class="space-y-4">
                        <input id="new-nom" value="${nom || ''}" placeholder="Quin plat és?" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold">
                        <textarea id="new-ing" placeholder="Ingredients..." class="w-full p-4 bg-slate-50 border rounded-2xl h-32 font-bold text-sm">${ing || ''}</textarea>
                        <textarea id="new-met" placeholder="Com es prepara?" class="w-full p-4 bg-slate-50 border rounded-2xl h-32 font-bold text-sm">${met || ''}</textarea>
                        <input id="new-link" type="url" value="${lnk || ''}" placeholder="Link web" class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm">
                    </div>
                    <button onclick="saveNew()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black">CREAR RECEPTA</button>
                </div>
            `);
        };

        window.saveNew = () => {
            const nomInput = document.getElementById('new-nom');
            if(!nomInput || !nomInput.value) return showToast("Falta el nom");
            const data = {
                nom: nomInput.value,
                ingredients: document.getElementById('new-ing').value || '',
                metode: document.getElementById('new-met').value || '',
                link: document.getElementById('new-link').value || '',
                fav: false, provar: true
            };
            db.ref('aliments').push(data).then(() => { closeModal(); showToast("Recepta guardada!"); });
        };

        window.openEditById = (id) => {
            const a = allAliments.find(item => item.id === id);
            if(a) openEdit(a);
        };

        window.openEdit = (a) => {
            showModal(`
                <div class="p-8 space-y-6">
                    <div class="flex justify-between items-start">
                        <h2 class="text-xl font-black recipe-card-text">${a.nom || 'Sense nom'}</h2>
                        <div class="flex gap-3">
                            <button onclick="toggleFav('${a.id}', ${!a.fav})">${a.fav ? '❤️' : '🤍'}</button>
                            <button onclick="closeModal()" class="text-slate-400 text-2xl">×</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <textarea id="edit-ing" class="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm font-bold">${a.ingredients || ''}</textarea>
                        <textarea id="edit-met" class="w-full p-4 bg-slate-50 border rounded-2xl h-32 text-sm font-bold">${a.metode || ''}</textarea>
                        <input id="edit-link" type="url" value="${a.link || ''}" class="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-bold">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="updateRecepta('${a.id}')" class="flex-1 bg-slate-900 text-white py-4 rounded-2xl font-black">DESAR</button>
                        <button onclick="deleteRecepta('${a.id}')" class="px-6 bg-red-100 text-red-500 rounded-2xl">🗑️</button>
                    </div>
                </div>
            `);
        };

        window.updateRecepta = (id) => {
            const upd = {
                ingredients: document.getElementById('edit-ing').value,
                metode: document.getElementById('edit-met').value,
                link: document.getElementById('edit-link').value
            };
            db.ref('aliments').child(id).update(upd).then(() => { closeModal(); showToast("Actualitzat"); });
        };

        window.deleteRecepta = (id) => {
            if(confirm("Eliminar recepta?")) {
                db.ref('aliments').child(id).remove().then(() => { closeModal(); showToast("Eliminada"); });
            }
        };

        window.openSelector = (f, t) => {
            const itemsHtml = allAliments.sort((a,b) => (a.nom || "").localeCompare(b.nom || "")).map(a => {
                const safeNom = (a.nom || '').replace(/'/g, "\\'");
                return `
                    <div onclick="addAndClose('${f}','${t}','${safeNom}', this)" class="sel-item p-4 bg-slate-50 rounded-xl font-bold cursor-pointer hover:bg-orange-50 border transition-colors mb-2" data-name="${safeNom}">
                        ${a.nom || 'Sense nom'}
                    </div>
                `;
            }).join('');

            showModal(`
                <div class="p-8 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-black">ESCULL PLAT</h2>
                        <button onclick="closeModal()" class="text-slate-400 text-2xl font-bold">×</button>
                    </div>
                    <input type="text" id="sel-search" oninput="filterSel()" placeholder="Cerca un plat..." class="w-full p-4 bg-slate-50 border rounded-2xl font-bold focus:ring-2 focus:ring-orange-500 outline-none">
                    <div class="max-h-[60vh] overflow-y-auto no-scrollbar pt-2">
                        ${itemsHtml}
                    </div>
                </div>
            `);
            
            setTimeout(() => document.getElementById('sel-search')?.focus(), 100);
        };

        window.addAndClose = (f, t, n, el) => {
            el.classList.add('bg-orange-500', 'text-white', 'scale-95');
            const current = (allSelections[f] && Array.isArray(allSelections[f][t])) ? [...allSelections[f][t]] : [];
            current.push(n);
            db.ref('seleccions').child(f).child(t).set(current).then(() => {
                closeModal();
                showToast(`Afegit: ${n}`);
            });
        };

        window.filterSel = () => {
            const searchInput = document.getElementById('sel-search');
            if(!searchInput) return;
            const q = searchInput.value.toLowerCase();
            document.querySelectorAll('.sel-item').forEach(i => {
                i.style.display = i.dataset.name.toLowerCase().includes(q) ? 'block' : 'none';
            });
        };

        window.removePlat = (f, t, i) => {
            if(!allSelections[f] || !allSelections[f][t]) return;
            const p = [...allSelections[f][t]];
            p.splice(i, 1);
            db.ref('seleccions').child(f).child(t).set(p);
        };

        window.exportMenuCSV = () => {
            const startStr = document.getElementById('export-start').value;
            const endStr = document.getElementById('export-end').value;
            if(!startStr || !endStr) return showToast("Tria dates");
            let csv = "Data,Dinar,Sopar\n";
            let cur = new Date(startStr);
            let end = new Date(endStr);
            while(cur <= end) {
                const iso = cur.toISOString().split('T')[0];
                const dinar = (allSelections[iso]?.comida || []).join(' | ');
                const sopar = (allSelections[iso]?.cena || []).join(' | ');
                csv += `${iso},"${dinar}","${sopar}"\n`;
                cur.setDate(cur.getDate() + 1);
            }
            downloadCSV(csv, `menu_${startStr}_${endStr}.csv`);
        };

        window.exportAlimentsCSV = () => {
            if (!allAliments.length) return showToast("No hi ha aliments per exportar");
            let csv = "Nom,Ingredients,Metode,Link,Preferit,Per Provar\n";
            allAliments.sort((a,b) => (a.nom || "").localeCompare(b.nom || "")).forEach(a => {
                const nom = (a.nom || "").replace(/"/g, '""');
                const ing = (a.ingredients || "").replace(/"/g, '""').replace(/\n/g, ' ');
                const met = (a.metode || "").replace(/"/g, '""').replace(/\n/g, ' ');
                const link = (a.link || "").replace(/"/g, '""');
                const fav = a.fav ? "SÍ" : "NO";
                const provar = a.provar ? "SÍ" : "NO";
                csv += `"${nom}","${ing}","${met}","${link}","${fav}","${provar}"\n`;
            });
            const timestamp = new Date().toISOString().split('T')[0];
            downloadCSV(csv, `llista_receptes_${timestamp}.csv`);
        };

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", filename);
            link.click();
        }

        window.showModal = (html) => {
            const m = document.getElementById('modal-container');
            const c = document.getElementById('modal-content');
            if(c) c.innerHTML = html;
            if(m) m.classList.remove('hidden');
        };

        window.closeModal = () => {
            const m = document.getElementById('modal-container');
            if(m) m.classList.add('hidden');
        };
        
        window.closeModalExtern = (e) => {
            if(e.target.id === 'modal-container') closeModal();
        }

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            if(!t) return;
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 1500);
        };

        function buildRecipeSearchUrl(query) {
            const cleanQuery = (query || '').replace(/['"]+/g, '').trim();
            return `https://www.google.com/search?q=${encodeURIComponent('recepta ' + cleanQuery)}`;
        }

        window.handleActionClick = (e, link, query) => {
            e.stopPropagation();
            const trimmedLink = (link || '').trim();
            if (trimmedLink && /^https?:\/\//i.test(trimmedLink)) {
                window.open(trimmedLink, '_blank', 'noopener,noreferrer');
            } else {
                window.open(buildRecipeSearchUrl(query), '_blank', 'noopener,noreferrer');
            }
        };
    </script>
</body>
</html>
