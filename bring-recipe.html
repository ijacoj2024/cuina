<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recepta per importar a Bring! · Cuina</title>
<style>body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:20px}.card{max-width:560px;margin:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px #0001}h1{font-size:22px;margin:0 0 8px}.muted{font-size:13px;color:#64748b;line-height:1.45}li{padding:7px 0;font-size:17px}.bring{margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0}</style>
</head>
<body><main class="card"><h1 id="name">Carregant recepta…</h1><p class="muted">Pàgina preparada en format de recepta perquè Bring! pugui detectar els ingredients per separat.</p><ul id="ingredients"></ul><div class="bring"><div data-bring-import style="display:none"></div><a href="https://www.getbring.com">Bring! Shopping List</a></div><p class="muted">Al mòbil també pots utilitzar Compartir del navegador i seleccionar Bring!. Després podràs desmarcar els ingredients que no vulguis afegir.</p></main>
<script>
const p=new URLSearchParams(location.search);const name=(p.get('name')||'Recepta del menú').trim();let ingredients=[];try{ingredients=JSON.parse(decodeURIComponent(p.get('items')||'%5B%5D'));}catch(e){}ingredients=[...new Set((Array.isArray(ingredients)?ingredients:[]).map(x=>String(x).trim()).filter(Boolean))];document.title=name+' · Cuina';document.getElementById('name').textContent=name;const ul=document.getElementById('ingredients');ingredients.forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.appendChild(li)});const data={"@context":"https://schema.org","@type":"Recipe","name":name,"author":{"@type":"Person","name":"Cuina de Casa"},"recipeYield":"4 racions","recipeIngredient":ingredients,"recipeInstructions":[{"@type":"HowToStep","text":"Preparar la recepta segons el receptari de Cuina de Casa."}]};const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(data);document.head.appendChild(s);
</script>
<script async src="https://platform.getbring.com/widgets/import.js"></script>
</body></html>
